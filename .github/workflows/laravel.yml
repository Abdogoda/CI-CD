name: Test Laravel Project

on: 
  push:
    paths:
      - 'laravel/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Display PHP version
        run: php -v
      
      - run: echo "Laravel Project Tested"
